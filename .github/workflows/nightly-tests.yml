name: Nightly Tests

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  HUSKY: 0
  VITE_BASE_PATH: /${{ github.event.repository.name }}/

jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c08001712a20409028fa5261 # v4.1.0
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@39cd149518dd237346121341cf9f2abe1376f9d6 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: |
          npm ci
          rm -rf apps/dashboard/node_modules

      - name: Frontend tests
        run: |
          npm run typecheck
          npm run lint
          npm run format:check --workspace=@ai-job-hunter/dashboard
          npm run test:coverage
          npm run build

      - name: Python tests
        run: |
          pip install -r scraper/requirements.txt -r apps/api/requirements.txt
          PYTHONPATH=. python3 -m unittest discover -s scraper/tests
          PYTHONPATH=. python3 -m unittest discover -s packages/ai_engine/tests
          PYTHONPATH=. python3 scripts/scanner_health.py
