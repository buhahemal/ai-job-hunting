name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  HUSKY: 0
  VITE_BASE_PATH: /${{ github.event.repository.name }}/

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c08001712a20409028fa5261 # v4.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Build dashboard artifact
        run: |
          npm ci
          rm -rf apps/dashboard/node_modules
          npm run build --workspace=@ai-job-hunter/dashboard

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c92800b496dd248c7e076dd59b7b6603e8a60427 # v2.1.0
        with:
          generate_release_notes: true
          files: |
            apps/dashboard/dist/**
