name: Reset All Data & Jobs

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target data to clear'
        required: true
        default: 'reset-jobs'
        type: choice
        options:
          - 'reset-jobs'
          - 'reset-all'
      force_profile_update:
        description: 'Force re-sync candidate profile after reset'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  reset:
    name: Reset Supabase Database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup-python

      - name: Run Reset Script
        env:
          PYTHONPATH: .
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TARGET: ${{ inputs.target || 'reset-jobs' }}
          FORCE_PROFILE: ${{ inputs.force_profile_update }}
        run: |
          if [ "$FORCE_PROFILE" = "true" ]; then
            python3 scripts/reset_and_sync_profile.py --action "$TARGET" --force
          else
            python3 scripts/reset_and_sync_profile.py --action "$TARGET"
          fi
