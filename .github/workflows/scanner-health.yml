name: Scanner Health

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@39cd149518dd237346121341cf9f2abe1376f9d6 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scanner health checks
        env:
          PYTHONPATH: .
        run: python3 scripts/scanner_health.py
