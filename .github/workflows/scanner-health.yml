name: Scanner Health

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scanner health checks
        env:
          PYTHONPATH: .
        run: python3 scripts/scanner_health.py
