name: Pipeline Cron

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scan-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: '3.11'

      - name: Cache Hugging Face model and pip downloads
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: hf-minilm-${{ runner.os }}-${{ hashFiles('packages/ai_engine/requirements.txt', 'scraper/requirements.txt') }}
          restore-keys: |
            hf-minilm-${{ runner.os }}-

      - name: Install Scraper Dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scanner preflight (imports + plugin health)
        env:
          PYTHONPATH: .
        run: |
          START=$(date +%s)
          python3 scripts/scanner_health.py
          END=$(date +%s)
          echo "Preflight elapsed: $((END - START))s"

      - name: Configure Supabase storage backend
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "Supabase secrets are required for the scanner pipeline."
            exit 1
          fi
          echo "Using Supabase storage backend."

      - name: Run Job Scraper Pipeline
        env:
          PYTHONPATH: .
          HF_HOME: ~/.cache/huggingface
          TRANSFORMERS_OFFLINE: '0'
          AI_SCORER: embedding
          GREENHOUSE_BOARD_TOKENS: ${{ secrets.GREENHOUSE_BOARD_TOKENS }}
          GREENHOUSE_BOARD_TOKEN: ${{ secrets.GREENHOUSE_BOARD_TOKEN }}
          LEVER_COMPANY_SITES: ${{ secrets.LEVER_COMPANY_SITES }}
          SMARTRECRUITERS_COMPANIES: ${{ secrets.SMARTRECRUITERS_COMPANIES }}
          TEAMTAILOR_COMPANY_SLUGS: ${{ secrets.TEAMTAILOR_COMPANY_SLUGS }}
          WORKABLE_ACCOUNT_SLUGS: ${{ secrets.WORKABLE_ACCOUNT_SLUGS }}
          ASHBY_JOB_BOARD_SLUGS: ${{ secrets.ASHBY_JOB_BOARD_SLUGS }}
          WORKDAY_CAREER_SITES: ${{ secrets.WORKDAY_CAREER_SITES }}
          WELLFOUND_SEARCH_PATHS: ${{ secrets.WELLFOUND_SEARCH_PATHS }}
          SCANNER_MIN_MATCH_SCORE: '75'
          SCANNER_MAX_PASSES: '4'
          SCANNER_LIMIT_STEP: '50'
          SCANNER_MAX_LIMIT_PER_SOURCE: '200'
          SCANNER_MAX_EVALUATIONS: '500'
          ATS_DISCOVERY_ENABLED: 'true'
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          START=$(date +%s)
          python3 -m scraper
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "Pipeline elapsed: ${ELAPSED}s"
          echo "PIPELINE_ELAPSED_SECONDS=${ELAPSED}" >> "$GITHUB_ENV"

      - name: Report pipeline timing
        run: |
          echo "Total pipeline step elapsed: ${PIPELINE_ELAPSED_SECONDS:-unknown}s"
          echo "Quality gate: preflight + scoring should stay under 900s (15 min) when sources are configured."
