name: CI

# Umbrella workflow — triggers all quality gates in parallel on PR/push.
# Individual workflows also exist for granular visibility in Actions tab.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0
  VITE_BASE_PATH: /${{ github.event.repository.name }}/

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  tests:
    uses: ./.github/workflows/tests.yml
  build:
    uses: ./.github/workflows/build.yml
  docker:
    uses: ./.github/workflows/docker.yml
  docs:
    uses: ./.github/workflows/docs.yml
  markdown:
    uses: ./.github/workflows/markdown.yml
  format:
    uses: ./.github/workflows/format.yml
  gitleaks:
    uses: ./.github/workflows/gitleaks.yml
  duplicate-code:
    uses: ./.github/workflows/duplicate-code.yml
  dead-code:
    uses: ./.github/workflows/dead-code.yml
  architecture:
    uses: ./.github/workflows/architecture.yml
  semgrep:
    uses: ./.github/workflows/semgrep.yml
  spellcheck:
    uses: ./.github/workflows/spellcheck.yml
  actionlint:
    uses: ./.github/workflows/actionlint.yml
