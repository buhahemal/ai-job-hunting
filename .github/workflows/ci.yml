name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0
  # Match GitHub Pages project-site URL (same as deploy-pages.yml)
  VITE_BASE_PATH: /${{ github.event.repository.name }}/

jobs:
  frontend:
    name: Frontend Quality Gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          rm -rf apps/dashboard/node_modules

      - name: Type check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier check (dashboard)
        run: npm run format:check --workspace=@ai-job-hunter/dashboard

      - name: Unit tests
        run: npm run test:coverage

      - name: Build (GitHub Pages)
        run: npm run build

  python:
    name: Python Quality Gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt
          pip install -r apps/api/requirements.txt

      - name: Scraper unit tests
        env:
          PYTHONPATH: .
        run: python3 -m unittest discover -s scraper/tests

      - name: Scanner health checks
        env:
          PYTHONPATH: .
        run: python3 scripts/scanner_health.py

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: ai-job-hunter:ci

  docs:
    name: Documentation Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify required documentation exists
        run: |
          required_files=(
            README.md
            AGENTS.md
            docs/architecture/overview.md
            docs/phases/README.md
            docs/phases/RULES.md
            packages/config/README.md
            apps/dashboard/README.md
            apps/api/README.md
            scraper/README.md
            scanners/README.md
          )
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing required doc: $file"
              exit 1
            fi
          done
          echo "All required documentation files present."

  markdown:
    name: Markdown Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          config: .markdownlint.json

  format:
    name: Prettier (root)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          rm -rf apps/dashboard/node_modules
        env:
          HUSKY: 0

      - name: Prettier check
        run: npm run format:check

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
