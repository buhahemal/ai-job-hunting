name: Rescan Insights

on:
  workflow_dispatch:

jobs:
  rescan-insights:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install Scraper Dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scanner preflight (imports + plugin health)
        env:
          PYTHONPATH: .
        run: python3 scripts/scanner_health.py

      - name: Rescore scan insights with current profile
        run: |
          PYTHONPATH=. python - <<'PY'
          from scraper.rescan_engine import RescanEngine
          from scraper.scanner_engine import create_job_store

          store = create_job_store()
          count = RescanEngine(store).run()
          print(f"Rescored {count} scanned job row(s)")
          PY
