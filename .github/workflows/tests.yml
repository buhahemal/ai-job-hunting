name: Tests

on:
  workflow_call:

jobs:
  frontend:
    name: Frontend Tests & Coverage
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm run test:coverage

  python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
      - name: Run Python unit tests
        env:
          PYTHONPATH: .
          USE_JSON_STORE: 'true'
        run: |
          python3 -m unittest discover -s scraper/tests
          python3 -m unittest discover -s packages/database/tests
          python3 -m unittest discover -s packages/scanner_sdk/tests
      - name: Scanner health checks
        env:
          PYTHONPATH: .
        run: python3 scripts/scanner_health.py
