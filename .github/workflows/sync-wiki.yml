name: Sync GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - 'docs/PROJECT-TRACKER.md'
      - 'docs/phases/README.md'
      - 'scripts/sync_docs_to_wiki.sh'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Push wiki pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Sync docs/wiki to GitHub Wiki
        env:
          GITHUB_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIKI_COMMIT_MESSAGE: 'docs: sync from ${{ github.sha }}'
        run: |
          chmod +x scripts/sync_docs_to_wiki.sh
          scripts/sync_docs_to_wiki.sh
