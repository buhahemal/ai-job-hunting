name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/dashboard/**'
      - 'apps/api/data/data.json'
      - 'packages/**'
      - 'supabase/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  HUSKY: 0
  VITE_BASE_PATH: /${{ github.event.repository.name }}/

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          rm -rf apps/dashboard/node_modules

      - name: Configure Supabase client for Pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            {
              echo "VITE_USE_SUPABASE=true"
              echo "VITE_SUPABASE_URL=$SUPABASE_URL"
              echo "VITE_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            } >> "$GITHUB_ENV"
            echo "Building dashboard with Supabase data source."
          else
            echo "VITE_USE_SUPABASE=false" >> "$GITHUB_ENV"
            echo "Supabase secrets missing — static JSON + localStorage mode."
          fi

      - name: Build Dashboard (GitHub Pages)
        run: npm run build --workspace=@ai-job-hunter/dashboard

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/dashboard/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
