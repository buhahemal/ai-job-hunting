name: Scanner Cron

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scan-and-score:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Scraper Dependencies
        run: pip install -r scraper/requirements.txt

      - name: Configure storage backend
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_KEY" ]; then
            echo "USE_JSON_STORE=false" >> "$GITHUB_ENV"
            echo "Using Supabase storage backend."
          else
            echo "USE_JSON_STORE=true" >> "$GITHUB_ENV"
            echo "Supabase secrets missing — using JSON file fallback."
          fi

      - name: Run Job Scraper Pipeline
        env:
          PYTHONPATH: .
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 -m scraper

      - name: Commit JSON updates (fallback mode only)
        if: env.USE_JSON_STORE == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/data/data.json
          if git diff --staged --quiet; then
            echo "No new jobs fetched in this interval."
          else
            git commit -m "chore(data): automated daily job scan updates [skip ci]"
            git push
          fi
