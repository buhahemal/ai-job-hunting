name: Scanner Cron

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scan-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache Hugging Face model and pip downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: hf-minilm-${{ runner.os }}-${{ hashFiles('packages/ai_engine/requirements.txt', 'scraper/requirements.txt') }}
          restore-keys: |
            hf-minilm-${{ runner.os }}-

      - name: Install Scraper Dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scanner preflight (imports + plugin health)
        env:
          PYTHONPATH: .
        run: python3 scripts/scanner_health.py

      - name: Configure Supabase storage backend
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "Supabase secrets are required for the scanner pipeline."
            exit 1
          fi
          echo "Using Supabase storage backend."

      - name: Run Job Scraper Pipeline
        env:
          PYTHONPATH: .
          HF_HOME: ~/.cache/huggingface
          TRANSFORMERS_OFFLINE: '0'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GREENHOUSE_BOARD_TOKENS: ${{ secrets.GREENHOUSE_BOARD_TOKENS }}
          GREENHOUSE_BOARD_TOKEN: ${{ secrets.GREENHOUSE_BOARD_TOKEN }}
          LEVER_COMPANY_SITES: ${{ secrets.LEVER_COMPANY_SITES }}
          SMARTRECRUITERS_COMPANIES: ${{ secrets.SMARTRECRUITERS_COMPANIES }}
          TEAMTAILOR_COMPANY_SLUGS: ${{ secrets.TEAMTAILOR_COMPANY_SLUGS }}
          WORKABLE_ACCOUNT_SLUGS: ${{ secrets.WORKABLE_ACCOUNT_SLUGS }}
          SCANNER_MAX_PASSES: '0'
          SCANNER_LIMIT_STEP: '50'
          SCANNER_MAX_LIMIT_PER_SOURCE: '2000'
          SCANNER_MAX_EVALUATIONS: '3000'
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 -m scraper
