name: Scanner Cron

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scan-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache Hugging Face model and pip downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: hf-minilm-${{ runner.os }}-${{ hashFiles('packages/ai_engine/requirements.txt', 'scraper/requirements.txt') }}
          restore-keys: |
            hf-minilm-${{ runner.os }}-

      - name: Install Scraper Dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scanner preflight (imports + plugin health)
        env:
          PYTHONPATH: .
        run: python3 scripts/scanner_health.py

      - name: Configure storage backend
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_KEY" ]; then
            echo "USE_JSON_STORE=false" >> "$GITHUB_ENV"
            echo "Using Supabase storage backend."
          else
            echo "USE_JSON_STORE=true" >> "$GITHUB_ENV"
            echo "Supabase secrets missing — using JSON file fallback."
          fi

      - name: Run Job Scraper Pipeline
        env:
          PYTHONPATH: .
          HF_HOME: ~/.cache/huggingface
          TRANSFORMERS_OFFLINE: '0'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GREENHOUSE_BOARD_TOKENS: ${{ secrets.GREENHOUSE_BOARD_TOKENS }}
          GREENHOUSE_BOARD_TOKEN: ${{ secrets.GREENHOUSE_BOARD_TOKEN }}
          LEVER_COMPANY_SITES: ${{ secrets.LEVER_COMPANY_SITES }}
          SMARTRECRUITERS_COMPANIES: ${{ secrets.SMARTRECRUITERS_COMPANIES }}
          TEAMTAILOR_COMPANY_SLUGS: ${{ secrets.TEAMTAILOR_COMPANY_SLUGS }}
          WORKABLE_ACCOUNT_SLUGS: ${{ secrets.WORKABLE_ACCOUNT_SLUGS }}
          SCANNER_MAX_PASSES: '0'
          SCANNER_LIMIT_STEP: '50'
          SCANNER_MAX_LIMIT_PER_SOURCE: '2000'
          SCANNER_MAX_EVALUATIONS: '3000'
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 -m scraper

      - name: Commit JSON updates (fallback mode only)
        if: env.USE_JSON_STORE == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/data/data.json
          if git diff --staged --quiet; then
            echo "No new jobs fetched in this interval."
          else
            git commit -m "chore(data): automated daily job scan updates [skip ci]"
            git push
          fi
