name: Scanner Cron

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scan-and-score:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Scraper Dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run Job Scraper Pipeline
        env:
          PYTHONPATH: .
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 -m scraper

      - name: Commit & Push Updated Leads
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/data/data.json
          if git diff --staged --quiet; then
            echo "No new jobs fetched in this interval."
          else
            git commit -m "chore(data): automated daily job scan updates [skip ci]"
            git push
          fi
