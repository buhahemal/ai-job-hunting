name: Setup Node workspace
description: Install Node.js 24, run npm ci, and remove nested dashboard node_modules for CI.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: npm
    - name: Install dependencies
      shell: bash
      run: |
        npm ci
        rm -rf apps/dashboard/node_modules
      env:
        HUSKY: '0'
