name: Setup Node workspace
description: Install Node.js 24, run npm ci, and remove nested dashboard node_modules for CI.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
      with:
        node-version: '24'
        cache: npm
    - name: Install dependencies
      shell: bash
      run: |
        npm ci
        rm -rf apps/dashboard/node_modules
      env:
        HUSKY: '0'
