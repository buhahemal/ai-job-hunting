name: Setup Python workspace
description: Install Python 3.11 and pip dependencies for scraper and API packages.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@39cd149518dd237346121341cf9f2abe1376f9d6 # v5.4.0
      with:
        python-version: '3.11'
    - name: Install Python dependencies
      shell: bash
      run: |
        pip install -r scraper/requirements.txt
        pip install -r apps/api/requirements.txt
